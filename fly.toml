# Fly.io configuration for 24/7 always-on execution on 0.0.0.0:8080
app = 'kestrel-trade'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

# Bot state lives in /data (server.ts SERVER_DATA_DIR); without a volume it is wiped on every machine restart.
[mounts]
  source = 'kestrel_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
